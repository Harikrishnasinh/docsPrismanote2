            type: string
          example: '123456789101112131415'
          required: true
        - name: organization-id
          in: header
          schema:
            type: string
          example: 'your organization id '
          required: true
        - name: iBusinessId
          in: header
          schema:
            type: string
          example: 'your business id '
          required: true
      responses:
        '200':
          description: Successful response

  /shared-transaction/detail/{iSharedTransactionId}:
    get:
      tags:
        - cash-services > shared-transaction > detail
      summary: 7. Shared Transaction detail
      description: This API used to get the details of shared transaction on the basis of id
