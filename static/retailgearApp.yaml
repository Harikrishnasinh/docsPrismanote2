  /shared-transaction/:
    post:
      tags:
        - cash-services > shared-transaction > create
      summary: 6. Shared Transaction create
      description: This API used to create shared transaction
      servers:
      - url: 'https://cash.2-retailgear.org/api/v1'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                {
                    "iBusinessId": "5b98f433d7cbaf223023dc93",
                    "iLocationId": "63bee4efb5144956c47b009a",
                    "iWorkstationId": "64744e412b0c6119e60a1899",
                    "iBusinessPartnerId": "66210dc0f41e58b89c7e7980",
                    "iBusinessPartnerLocationId": "63516306683446bf3f90403f",
                    "iBusinessLocationId": "623b6d840ed1002890334456",
                    "aItems": [
                        {
                            "productNumber": "ProductId 1 Feb added Manually",
                            "supplierDescription": "",
                            "sellingPrice": 199,
                            "nVatRate": 9,
                            "purchasePrice": 99,
                            "oBusinessBrand": {},
                            "oArticleGroup": {},
                            "nQuantity": 1,
                            "EAN": "",
                            "nMargin": 1.52,
                            "gift": false,
                            "ship_cost": false
                        }
                    ]
                }
      parameters:
        - name: x-auth-type
          in: header
          schema:
            type: string
